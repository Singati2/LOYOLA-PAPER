name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-path:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: "Install pinned dependencies from requirements-lock.txt (the versions that produced the committed outputs)"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
      # offline: the NIST WebBook pages are not redistributed and CI does not download them;
      # the checks that read them are reported as NOT RUN (see verify.py)
      - name: "Fast verification path, offline (core verifier, prose numbers, regression and baseline tests, constancy check, manifest)"
        run: python verify.py --offline
